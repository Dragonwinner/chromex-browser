name: CI - Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Package Validation
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        node-version: [ 18.x, 20.x ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: npm install --include=optional

      - name: Build & Bundle Extension (esbuild)
        run: npx --yes esbuild extension.js --bundle --platform=node --target=node18 --outfile=dist/extension.js --external:vscode --format=cjs

      - name: Validate VSIX Package Creation
        run: npx --yes @vscode/vsce package --no-dependencies --allow-missing-repository
