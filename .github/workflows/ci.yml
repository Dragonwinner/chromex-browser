name: CI - Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Package Validation
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        node-version: [ 18.x, 20.x ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build & Bundle Extension (esbuild)
        run: npm run build

      - name: Validate VSIX Package Creation
        run: npx -y @vscode/vsce package --no-dependencies

      - name: Check Package Size
        run: |
          node -e "
          const fs = require('fs');
          const vsix = fs.readdirSync('.').find(f => f.endsWith('.vsix'));
          if (!vsix) throw new Error('VSIX package was not generated');
          const sizeMB = fs.statSync(vsix).size / (1024 * 1024);
          console.log('✅ VSIX generated: ' + vsix + ' (' + sizeMB.toFixed(2) + ' MB)');
          "
